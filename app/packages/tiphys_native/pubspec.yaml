name: tiphys_native
description: "Tiphys'in küçük Android yerel yöntemleri (arka plandaki bildirim düğmesinden panoya yazma)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aurict.tiphys_native
        pluginClass: TiphysNativePlugin
