# Dev machine limit: at most 2 cores, ~4 GB memory in total (run via tools/limited.sh).
# No daemon and the Kotlin compiler runs in-process: everything stays in the watchdog's process group.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# receive_sharing_intent 1.8.1 compiles targeting Java 11 / Kotlin 17; fine on Android (D8), so warn instead of error.
kotlin.jvm.target.validation.mode=warning
