# Geliştirme makinesi sınırı: en fazla 2 çekirdek, toplam ~4 GB bellek (tools/sinirli.sh ile çalıştır).
# Arka plan süreci yok ve Kotlin derleyicisi aynı süreçte: hepsi bekçinin süreç grubunda kalsın.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# receive_sharing_intent 1.8.1 Java 11 / Kotlin 17 hedefiyle derleniyor; Android'de (D8) sorun değil, hata yerine uyarı.
kotlin.jvm.target.validation.mode=warning
