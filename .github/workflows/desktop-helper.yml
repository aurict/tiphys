name: desktop-helper

on:
  push:
    branches: [main]
    paths: ["desktop-helper/**", ".github/workflows/desktop-helper.yml"]
  pull_request:
    paths: ["desktop-helper/**", ".github/workflows/desktop-helper.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-helper-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop-helper
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-helper
      - name: Xvfb for the x11 integration test (it starts its own private server)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy without the portal backend (zbus)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked

  release:
    name: Release build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          # Cross-built on the arm64 runner (Intel macOS runners are being retired).
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-helper
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.name != 'macos-x64'
        run: ./target/${{ matrix.target }}/release/tiphys-desktop --version
      - name: Idle memory of `serve` (budget 15 MB RSS)
        if: runner.os == 'Linux'
        run: |
          coproc H { TIPHYS_DESKTOP_BACKEND=none ./target/${{ matrix.target }}/release/tiphys-desktop serve; }
          read -r hello <&"${H[0]}"
          echo "$hello"
          rss=$(awk '/^VmRSS:/ {print $2}' "/proc/$H_PID/status")
          echo "idle RSS: ${rss} kB"
          kill "$H_PID"
          test "$rss" -lt 15360
      - uses: actions/upload-artifact@v7
        with:
          name: tiphys-desktop-${{ matrix.name }}
          path: desktop-helper/target/${{ matrix.target }}/release/tiphys-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
