name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (TypeScript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
      - name: Load compiled modules in plain Node (catches ESM/CJS interop that vitest hides)
        run: |
          node --input-type=module -e "
          import { readdirSync } from 'node:fs';
          const files = readdirSync('dist', { recursive: true }).filter(f => f.endsWith('.js') && !/^(cli|firefox_host)\.js$/.test(f));
          for (const f of files) await import('./dist/' + f);
          console.log('loaded', files.length, 'modules');"
      - name: Feature modules load only when their feature is on (memory, PLAN.md §18 H4)
        run: node test/load_check.mjs
      - name: Memory of an agent with only "system" on (budget; ~111 MB measured on the dev PC)
        run: MAX_MB=160 NODE_OPTIONS=--max-semi-space-size=1 ../tools/measure-agent.sh system
      - name: Smoke test (serve with a temp config, pair, /v1/health, /v1/system)
        run: node test/smoke.mjs

  agent-platforms:
    # P3: the server features on macOS and Windows. The full suite assumes Linux (systemd, Unix sockets, shell
    # helpers); here run the platform tests: parsers with recorded outputs plus the native implementations.
    name: Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - name: Platform tests (parsers everywhere, native implementation of this OS)
        run: npx vitest run platform_
      - run: npm run build
      - name: Feature modules load only when their feature is on
        run: node test/load_check.mjs
      - name: Smoke test (serve with a temp config, pair, /v1/health, /v1/system)
        run: node test/smoke.mjs

  atspi-helper:
    name: AT-SPI helper (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (fake accessibility tree; real tests need TIPHYS_REAL=1)
        working-directory: agent/test/py
        run: python3 -I -m unittest -v

  firefox:
    name: Firefox extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firefox/package-lock.json
      - run: npm ci --include=dev
      - run: npm audit signatures --include=dev
      - run: npm run lint
      - name: Build XPI (verifies the pinned Readability hash)
        run: npm run build

  app:
    name: App (Flutter)
    runs-on: ubuntu-24.04
    env:
      # Golden images show local times; they were generated in this time zone.
      TZ: Europe/Berlin
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - name: Tests (real-server integration tests excluded)
        run: flutter test --exclude-tags real
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/goldens/failures/
          if-no-files-found: ignore

  apk:
    name: APK (debug build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (catches Gradle/plugin breakage that unit tests can't)
        run: flutter build apk --debug --target-platform android-arm64

  # Other platforms (P4, P5): separate jobs so the Android checks above stay fast. They prove the app and its plugins
  # compile there; nothing is signed or published.
  ios:
    name: iOS (build, no signing)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug

  macos:
    name: macOS desktop (build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug

  windows:
    name: Windows desktop (build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows

  linux:
    name: Linux desktop (build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Desktop build dependencies (GTK; libsecret and jsoncpp for flutter_secure_storage)
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
