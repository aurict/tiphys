name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
        Remove host names, tokens and IP addresses from logs before pasting them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [App (Android), Agent, Firefox extension, Documentation, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version, agent version (`GET /v1/health`), Android version, OS of the agent machine.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Agent log (`journalctl --user -u tiphys-agent`), with secrets removed.
      render: text
