<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tiphys · Odak (taslak)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="draft.css">
<link rel="stylesheet" href="focus.css">
<script type="module" src="focus.js"></script>
</head>
<!-- W0 visual draft of Odak. ?phase=break shows the short break (warm tone, "kalk, su iç"). ?perf: frame counter. -->
<body class="draft focus" data-phase="focus">
<canvas id="fbg" aria-hidden="true"></canvas>

<main id="stage">
  <div class="f-corner f-tl">
    <div class="overline" id="f-mode">ODAK MODU</div>
    <div class="f-round" id="f-round"></div>
  </div>
  <div class="f-corner f-tr">
    <div class="f-clock" id="f-clock">00:00</div>
    <div class="f-date" id="f-date"></div>
  </div>

  <section class="f-center" aria-label="Odak sayacı">
    <div class="f-ring">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92"/>
        <circle class="arc" id="f-arc" cx="100" cy="100" r="92" pathLength="100"/>
      </svg>
      <div class="f-inner">
        <div class="f-phase" id="f-phase">ODAK</div>
        <div class="f-time" id="f-time">00:00</div>
        <div class="f-sub" id="f-sub"></div>
      </div>
    </div>
    <div class="f-dots" id="f-dots" aria-label="Turlar"></div>
    <div class="f-task" id="f-task">
      <div class="overline">ŞU AN</div>
      <div class="f-task-t">Ekran modları W0 taslağını bitir</div>
    </div>
    <article class="card f-break" id="f-break">
      <div class="fb-ic" data-icon="droplet" data-size="34"></div>
      <div>
        <div class="fb-t">Kalk, su iç</div>
        <div class="fb-s">Omuzlarını gevşet, gözlerini 20 saniye uzağa çevir.</div>
        <div class="fb-next">Sonra: <span>Ekran modları W0 taslağını bitir</span></div>
      </div>
    </article>
  </section>

  <article class="card f-music" aria-label="Müzik">
    <div class="mc-cover" data-icon="music" data-size="24"></div>
    <div class="mu-text">
      <div class="mu-t">Yağmurlu Pazar</div>
      <div class="mu-a">Örnek Sanatçı</div>
      <div class="progress" id="f-progress"><div class="bar"><div class="fill"></div></div></div>
    </div>
  </article>
  <div class="f-quiet chip"><span class="ic-wrap" data-icon="bell" data-size="16"></span><span>Yalnız kritik bildirimler</span></div>
</main>
<div id="perf" hidden></div>
</body>
</html>
