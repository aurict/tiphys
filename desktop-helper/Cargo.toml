[package]
name = "tiphys-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native desktop helper for the Tiphys agent (X11, Sway, GNOME/KDE portal, Windows, macOS)"
license = "MIT"
publish = false

[[bin]]
name = "tiphys-desktop"
path = "src/main.rs"

[features]
default = ["portal"]
# GNOME/KDE Wayland through xdg-desktop-portal (pulls zbus; it only connects when that backend is chosen).
portal = ["dep:zbus"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "dpms", "randr"] }
arboard = { version = "3", default-features = false }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
zune-jpeg = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
